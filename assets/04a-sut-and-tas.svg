<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="SUTとTAS" aria-describedby="desc">
<desc id="desc">左にSUT（テスト対象のシステム。画面、API、業務ロジック、データ）、右にTAS（テストを自動実行・制御するシステム。テストスクリプト、実行制御、結果取得・証跡、実行環境・テストデータ）を並べ、TASからSUTへテスト実行の矢印を引いた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">SUTはテスト対象、TASはテストを自動実行するシステム</text>
<rect x="60" y="90" width="400" height="200" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="260" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">SUT（System Under Test）</text>
<text x="260" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">テスト対象のシステム。業務アプリケーションなど</text>
<rect x="80" y="170" width="176" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="168" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">画面</text>
<rect x="264" y="170" width="176" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="352" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">API</text>
<rect x="80" y="216" width="176" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="168" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">業務ロジック</text>
<rect x="264" y="216" width="176" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="352" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">データ</text>
<rect x="540" y="90" width="400" height="200" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="740" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">TAS（Test Automation System）</text>
<text x="740" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">テストを自動実行・制御するシステム</text>
<rect x="560" y="170" width="176" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="648" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テストスクリプト</text>
<rect x="744" y="170" width="176" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="832" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">実行制御</text>
<rect x="560" y="216" width="176" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="648" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">結果取得・証跡</text>
<rect x="744" y="216" width="176" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="832" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">実行環境・テストデータ</text>
<path d="M540.0 190.0 L470.0 190.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="460.0,190.0 472.0,183.0 472.0,197.0" fill="#607a91"/>
<text x="500" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">テスト実行</text>
<text x="500" y="342" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">SUTは機能追加や画面変更で変わり続け、TASはその変更に追従する。</text><text x="500" y="364" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">TASはテストを自動化すると新たに生まれるもう一つのシステム</text>
</svg>
