<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="676" viewBox="0 0 1000 676" role="img" aria-label="氷山の図。水面上の小さな部分がAIエージェントで短時間に行えるテストコード生成・修復で、水面下の大きな部分にCI Runner、ブラウザ更新、認証情報、対象環境、テストデータ、証跡、原因調査、復旧という8つの運用要素が残ることを示す">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">AIが下げるのは作成部分。水面下に運用要素が残る</text>
<rect x="0" y="240" width="1000" height="436" fill="#d6e6f2"/>
<path d="M0 240 H1000" stroke="#607a91" stroke-width="2" stroke-dasharray="10 8"/>
<polygon points="500,90 560,135 620,185 650,240 350,240 380,185 440,135" fill="#eef3f1" stroke="#8ea6b2" stroke-width="2"/>
<polygon points="650,240 820,340 860,440 760,560 600,610 400,610 240,560 140,440 180,340 350,240" fill="#e1edf8" stroke="#8ea6b2" stroke-width="2"/>
<text x="500" y="200" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">テストコード生成・修復</text>
<path d="M660 150 H730" stroke="#607a91" stroke-width="2"/>
<text x="740" y="140" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">作成部分</text><text x="740" y="160" text-anchor="start" font-family="sans-serif" font-size="15" fill="#36556d">AIエージェントで短時間に</text><text x="740" y="180" text-anchor="start" font-family="sans-serif" font-size="15" fill="#36556d">行えるようになった</text>
<text x="120" y="228" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">見えやすい部分</text>
<text x="120" y="262" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">見えにくい部分</text>
<rect x="230" y="300" width="260" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="360" y="323" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">CI Runnerの構築・管理</text>
<rect x="510" y="300" width="260" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="640" y="323" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">ブラウザ・依存パッケージの更新</text>
<rect x="230" y="348" width="260" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="360" y="371" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">認証情報・アクセス権限の管理</text>
<rect x="510" y="348" width="260" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="640" y="371" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テスト実行対象環境の準備</text>
<rect x="230" y="396" width="260" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="360" y="419" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テストデータの初期化・管理</text>
<rect x="510" y="396" width="260" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="640" y="419" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">実行結果・証跡の保存</text>
<rect x="230" y="444" width="260" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="360" y="467" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">実行失敗時の原因調査</text>
<rect x="510" y="444" width="260" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="640" y="467" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">障害発生時の復旧・再実行</text>
<text x="500" y="540" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#c0604a">継続的にテストを動かすための運用要素（残る部分）</text>
<text x="500" y="636" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5d6c75">これらはAIで設定ファイルを生成すれば完了する仕事ではなく、</text><text x="500" y="658" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5d6c75">更新確認・切り分け・運用責任を含めて管理し続ける必要がある</text>
</svg>
