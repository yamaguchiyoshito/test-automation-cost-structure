<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="テスト対象のSUTと、テストを自動実行するTASの二つのシステムを並べ、SUTの変更がTASの修正を生み、TAS自身にも更新や障害対応が発生すること、そして人手のテスト実行の削減とTASの構築・保守の負担が天秤で交換されていることを示す図">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">テスト自動化はもう一つのシステム（TAS）を生む</text>
<rect x="70" y="100" width="320" height="104" rx="12" fill="#e1edf8" stroke="#8ea6b2" stroke-width="1"/><text x="230" y="148" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">SUT（System Under Test）</text><text x="230" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">テスト対象のシステム。業務アプリケーションなど</text>
<rect x="610" y="100" width="320" height="104" rx="12" fill="#f7e9d4" stroke="#8ea6b2" stroke-width="1"/><text x="770" y="148" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">TAS（Test Automation System）</text><text x="770" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">テストスクリプト、実行制御、結果取得など</text>
<path d="M390.0 152.0 L600.0 152.0" stroke="#c0604a" stroke-width="3" fill="none"/><polygon points="610.0,152.0 598.0,159.0 598.0,145.0" fill="#c0604a"/>
<text x="500" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#c0604a">機能追加・画面変更</text><text x="500" y="147" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0604a">→ テストの変更が必要に</text>
<rect x="310" y="262" width="124" height="34" rx="17.0" fill="#f6e4e8" stroke="#8ea6b2" stroke-width="1"/><text x="372" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">ライブラリ更新</text>
<path d="M372.0 262.0 L575.3 208.5" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="585.0,206.0 575.2,215.8 571.6,202.3" fill="#607a91"/>
<rect x="446" y="262" width="194" height="34" rx="17.0" fill="#f6e4e8" stroke="#8ea6b2" stroke-width="1"/><text x="543" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">ブラウザのバージョン変更</text>
<path d="M543.0 262.0 L626.5 211.2" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="635.0,206.0 628.4,218.2 621.1,206.3" fill="#607a91"/>
<rect x="652" y="262" width="138" height="34" rx="17.0" fill="#f6e4e8" stroke="#8ea6b2" stroke-width="1"/><text x="721" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テストデータ整備</text>
<path d="M721.0 262.0 L690.4 214.4" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="685.0,206.0 697.4,212.3 685.6,219.9" fill="#607a91"/>
<rect x="802" y="262" width="152" height="34" rx="17.0" fill="#f6e4e8" stroke="#8ea6b2" stroke-width="1"/><text x="878" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">実行環境の障害対応</text>
<path d="M878.0 262.0 L744.3 209.6" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="735.0,206.0 748.7,203.9 743.6,216.9" fill="#607a91"/>
<text x="770" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">TAS自身にも保守が発生する</text>
<polygon points="500,460 474,506 526,506" fill="#607a91"/>
<path d="M270 450 L730 430" stroke="#607a91" stroke-width="4" stroke-linecap="round"/>
<path d="M270 450 V480" stroke="#607a91" stroke-width="2"/>
<path d="M730 430 V460" stroke="#607a91" stroke-width="2"/>
<rect x="140" y="480" width="260" height="60" rx="12" fill="#e0f0e9" stroke="#5aa06f" stroke-width="2"/>
<text x="270" y="504" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#5aa06f">削減されるもの</text><text x="270" y="523" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">人手によるテスト実行</text>
<rect x="600" y="460" width="260" height="60" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="2"/>
<text x="730" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#c0604a">交換で生まれる負担</text><text x="730" y="503" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">TASの構築・保守</text>
<text x="500" y="392" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#18324b">人手によるテスト実行の削減は、TASを構築・保守する負担と交換されている</text>
<text x="500" y="572" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5d6c75">自動化の価値は、この交換が経済的に成立するかどうかで決まる</text>
</svg>
