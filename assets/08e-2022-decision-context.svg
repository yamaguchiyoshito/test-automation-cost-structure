<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="584" viewBox="0 0 1000 584" role="img" aria-label="2022年の判断を形づくった5つの条件" aria-describedby="desc">
<desc id="desc">先行事例の存在、保守開発が約8割、技術スタックの多様さ、JSP中心の画面実装、CI/CD成熟度の制約という5つの条件が、SaaS型の画面E2Eテスト自動化という2022年の判断へ収束することを示す図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">2022年の判断を形づくった5つの条件</text>
<rect x="60" y="96" width="400" height="68" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="260" y="126" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">8.1 先行事例の存在</text><text x="260" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">導入判断の不確実性を減らす材料があった</text>
<path d="M460.0 130.0 L555.0 295.3" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="560.0,304.0 548.0,297.1 560.1,290.1" fill="#607a91"/>
<rect x="60" y="180" width="400" height="68" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="260" y="210" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">8.2 保守開発が約8割</text><text x="260" y="234" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">内部構造の変更を伴う施策は適用しにくい</text>
<path d="M460.0 214.0 L552.6 297.3" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="560.0,304.0 546.4,301.2 555.8,290.8" fill="#607a91"/>
<rect x="60" y="264" width="400" height="68" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="260" y="294" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">8.3 技術スタックの多様さ</text><text x="260" y="318" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">画面E2Eは内部実装に依存しにくく横断できる</text>
<path d="M460.0 298.0 L550.0 303.4" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="560.0,304.0 547.6,310.3 548.4,296.3" fill="#607a91"/>
<rect x="60" y="348" width="400" height="68" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="260" y="378" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">8.4 JSP中心の画面実装</text><text x="260" y="402" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">フロントエンド単体のテスト層を持ちにくい</text>
<path d="M460.0 382.0 L552.1 310.2" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="560.0,304.0 554.8,316.9 546.2,305.9" fill="#607a91"/>
<rect x="60" y="432" width="400" height="68" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="260" y="462" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">8.5 CI/CD成熟度の制約</text><text x="260" y="486" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">実行基盤の構築・保守を自前で持ちにくい</text>
<path d="M460.0 466.0 L554.7 312.5" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="560.0,304.0 559.7,317.9 547.7,310.5" fill="#607a91"/>
<rect x="560" y="222" width="380" height="164" rx="12" fill="#e1edf8" stroke="#18324b" stroke-width="2"/>
<text x="750" y="260" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#18324b">2022年の判断</text><text x="750" y="288" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">SaaS型の画面E2Eテスト自動化</text>
<text x="750" y="324" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">狙い：限られた専門人材で、</text><text x="750" y="343" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">多様な既存案件へ横展開できる</text><text x="750" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">検証効率化策を選ぶ</text>
<text x="500" y="552" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">個別案件で最大の自動化効果を得ることより、多様な案件へ横展開できることを重視した判断</text>
</svg>
