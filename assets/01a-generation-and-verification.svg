<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img" aria-label="生成と検証" aria-describedby="desc">
<desc id="desc">左に生成（要求から成果物をつくる作業。生成AIの登場で高速化した）、右に検証（成果物が要求を満たすかを確かめる作業。満たせば次の工程へ、満たさなければ手戻り）を並べた2パネルの図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">生成はつくる作業、検証は確かめる作業</text>
<rect x="60" y="90" width="420" height="190" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="270" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b5f9e">生成</text>
<text x="270" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">要求から成果物をつくる</text>
<rect x="90" y="176" width="140" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="160" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">要求</text>
<path d="M230.0 194.0 L300.0 194.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="310.0,194.0 298.0,201.0 298.0,187.0" fill="#607a91"/>
<text x="270" y="182" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">つくる</text>
<rect x="310" y="176" width="140" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="380" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">成果物</text>
<text x="270" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">生成AI・開発者が行う。生成AIの登場で高速化した</text>
<rect x="520" y="90" width="420" height="190" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="730" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b5f9e">検証</text>
<text x="730" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">成果物が要求を満たすかを確かめる</text>
<rect x="550" y="176" width="140" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="620" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">成果物</text>
<path d="M690.0 194.0 L760.0 194.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="770.0,194.0 758.0,201.0 758.0,187.0" fill="#607a91"/>
<text x="730" y="182" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">要求と照合</text>
<rect x="770" y="176" width="140" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="840" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">判定</text>
<text x="730" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">満たせば次の工程へ、満たさなければ手戻り</text>
<text x="500" y="332" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">生成が速くなっても、検証が同じ割合で速くなるとは限らない</text>
</svg>
