<svg xmlns="http://www.w3.org/2000/svg" width="928" height="328" viewBox="36 66 928 328" role="img" aria-label="SPAとJSPで持てるテストの層" aria-describedby="desc">
<desc id="desc">左にSPA（静的、単体のVitest、結合のStorybook・Testing Library、E2EのPlaywrightをTesting Trophy型に積み、結合の層を厚くする）、右にJSP（サーバー側でHTMLを組み立て単体で描画できないため、打鍵によるビッグバン型E2Eになりがちで、E2Eテストの自動化そのものが方策になる）を並べた図</desc>
<rect x="36" y="66" width="928" height="328" fill="#fcfdfd"/>
<rect x="60" y="90" width="420" height="280" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="270" y="122" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b5f9e">SPA</text>
<text x="270" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">コンポーネント構成。フロントエンド単体で層を持てる</text>
<rect x="170" y="158" width="200" height="34" rx="8" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/>
<text x="270" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">E2E：Playwright</text>
<rect x="100" y="198" width="340" height="50" rx="8" fill="#e0f0e9" stroke="#5aa06f" stroke-width="2"/>
<text x="270" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2f6b45">結合：Storybook・Testing Library</text>
<rect x="140" y="254" width="260" height="40" rx="8" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/>
<text x="270" y="279" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">単体：Vitest</text>
<rect x="180" y="300" width="180" height="30" rx="8" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/>
<text x="270" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">静的：型・Lint</text>
<text x="270" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">E2Eは主要シナリオに絞り、手前の層を厚くする</text>
<rect x="520" y="90" width="420" height="280" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="730" y="122" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">JSP</text>
<text x="730" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">サーバー側でHTMLを組み立てる。単体で描画できない</text>
<rect x="540" y="170" width="380" height="90" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="2"/>
<text x="730" y="204" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#9c3f2a">打鍵によるビッグバン型E2E</text><text x="730" y="228" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">サーバー・DB・認証を含めた全体を動かすしかない</text>
<text x="730" y="292" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">コンポーネントの境界がない</text><text x="730" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">画面を単体で描画して検証する標準手段がない</text>
<text x="730" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">だから、E2Eテストの自動化そのものが方策になる</text>
</svg>
