<svg xmlns="http://www.w3.org/2000/svg" width="928" height="366" viewBox="36 66 928 366" role="img" aria-label="静的検証と動的検証で整備する要素" aria-describedby="desc">
<desc id="desc">左に静的検証で整備する要素（検査対象の成果物、検査ルール、レビュー観点）、右に動的検証で整備する要素（実行環境、テストデータ、操作手順、期待結果、証跡の取り扱い）を並べ、右の要素を継続的に維持できるかが後半のCI/CD成熟度の課題につながることを注意枠で示した図</desc>
<rect x="36" y="66" width="928" height="366" fill="#fcfdfd"/>
<rect x="60" y="90" width="360" height="220" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="240" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">静的検証で整備する要素</text>
<text x="240" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">生成直後のワークフローに組み込みやすい</text>
<rect x="80" y="168" width="320" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="240" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">検査対象の成果物（コード・設計書）</text>
<rect x="80" y="212" width="320" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="240" y="234" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">検査ルール（型・静的解析・規約）</text>
<rect x="80" y="256" width="320" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="240" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">レビュー観点</text>
<rect x="460" y="90" width="480" height="220" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="700" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">動的検証で整備する要素</text>
<text x="700" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">実行して確かめるために要る</text>
<rect x="480" y="168" width="220" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="590" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">実行環境</text>
<rect x="710" y="168" width="220" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="820" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テストデータ</text>
<rect x="480" y="212" width="220" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="590" y="234" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">操作手順</text>
<rect x="710" y="212" width="220" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="820" y="234" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">期待結果</text>
<rect x="480" y="256" width="220" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="590" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">証跡の取り扱い</text>
<path d="M700 310 V338" stroke="#c0604a" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polygon points="700.0,340.0 693.0,328.0 707.0,328.0" fill="#c0604a"/>
<rect x="460" y="348" width="480" height="60" rx="12" fill="#fcfdfd" stroke="#c0604a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="700" y="372" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9c3f2a">これらを継続的に維持できるかが、</text><text x="700" y="391" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9c3f2a">後半で扱うCI/CD成熟度の課題につながる</text>
</svg>
