<svg xmlns="http://www.w3.org/2000/svg" width="928" height="274" viewBox="36 66 928 274" role="img" aria-label="生成と検証" aria-describedby="desc">
<desc id="desc">左に生成（要求から成果物を速くつくる。生成AIで高速化）、右に注意色で検証（成果物が要求を満たすかを確かめる。同じ割合では速くなっておらずボトルネック）を並べ、生成量が増えるほど検証の対象も増えることを太い矢印で示した図</desc>
<rect x="36" y="66" width="928" height="274" fill="#fcfdfd"/>
<rect x="60" y="90" width="400" height="200" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="260" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b5f9e">生成</text>
<text x="260" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">要求から成果物をつくる</text>
<rect x="90" y="176" width="140" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="160" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">要求</text>
<path d="M230.0 194.0 L310.0 194.0" stroke="#2b5f9e" stroke-width="4" fill="none"/><polygon points="320.0,194.0 308.0,201.0 308.0,187.0" fill="#2b5f9e"/>
<text x="275" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2b5f9e">速い</text>
<rect x="320" y="176" width="120" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="380" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">成果物</text>
<text x="260" y="256" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">生成AIで高速化。短時間で大量につくれる</text>
<path d="M460.0 190.0 L530.0 190.0" stroke="#607a91" stroke-width="6" fill="none"/><polygon points="540.0,190.0 528.0,197.0 528.0,183.0" fill="#607a91"/>
<text x="500" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">生成量が増えるほど、検証の対象も増える</text>
<rect x="540" y="90" width="400" height="200" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="3"/>
<text x="740" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#9c3f2a">検証</text>
<text x="740" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">成果物が要求を満たすかを確かめる</text>
<rect x="570" y="176" width="140" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="640" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">成果物</text>
<path d="M710.0 194.0 L790.0 194.0" stroke="#c0604a" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polygon points="800.0,194.0 788.0,201.0 788.0,187.0" fill="#c0604a"/>
<text x="755" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9c3f2a">遅い</text>
<rect x="800" y="176" width="120" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="860" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">判定</text>
<text x="740" y="256" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9c3f2a">同じ割合では速くなっていない ＝ ボトルネック</text>
</svg>
