<svg xmlns="http://www.w3.org/2000/svg" width="964" height="318" viewBox="36 66 964 318" role="img" aria-label="自社で担う負担の移り変わり" aria-describedby="desc">
<desc id="desc">Seleniumの初期、Selenium IDE、クラウド実行環境、ノーコード型SaaSの4段階について、上段に減った負担（作成負担の軽減、実行環境の一部の外部化、作成・実行・証跡・修復の一体提供）、下段に残った負担（画面変更に伴う修正、作成・期待結果・業務データ、期待結果・データ・十分性の判断）を並べた流れ図</desc>
<rect x="36" y="66" width="964" height="318" fill="#fcfdfd"/>
<text x="60" y="104" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#2f6b45">減った負担</text>
<text x="60" y="280" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#9c3f2a">残った負担</text>
<rect x="60" y="120" width="214" height="110" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="167" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">Seleniumの初期</text>
<text x="167" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">操作スクリプトも実行環境も</text><text x="167" y="193" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">自社で準備</text>
<rect x="60" y="296" width="214" height="64" rx="12" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/>
<text x="167" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#55646d">（出発点）</text>
