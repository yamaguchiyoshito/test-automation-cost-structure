<rect x="294" y="120" width="214" height="110" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="401" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">Selenium IDE</text>
<text x="401" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">テストの作成負担を軽減</text>
<rect x="294" y="296" width="214" height="64" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1"/>
<text x="401" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9c3f2a">画面変更に伴う修正</text>
<path d="M508.0 175.0 L518.0 175.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="528.0,175.0 516.0,182.0 516.0,168.0" fill="#607a91"/>
<rect x="528" y="120" width="214" height="110" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="635" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">クラウド実行環境</text>
<text x="635" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">ブラウザ・OSの用意と維持の</text><text x="635" y="193" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">一部を提供者へ</text>
<rect x="528" y="296" width="214" height="64" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1"/>
<text x="635" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9c3f2a">テスト作成・期待結果・</text><text x="635" y="339" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9c3f2a">業務データの準備</text>
<path d="M742.0 175.0 L752.0 175.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="762.0,175.0 750.0,182.0 750.0,168.0" fill="#607a91"/>
<rect x="762" y="120" width="214" height="110" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="869" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">ノーコード型SaaS</text>
