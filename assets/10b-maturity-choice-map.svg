<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="598" viewBox="0 0 1000 598" role="img" aria-label="成熟度による選択肢の地図" aria-describedby="desc">
<desc id="desc">横軸をCI/CD成熟度、縦軸を基盤保守の共通チームの有無とした2軸のマップ。左下にノーコード型SaaSが適する領域、右上にPlaywrightとAIエージェントが適する領域を置き、短期はSaaSで効果を得て、中長期は共通基盤を整備して右上へ移る方針を破線の矢印で示す</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">組織の成熟度で選択肢は変わる。短期と中長期を分けて考える</text>
<rect x="170" y="90" width="740" height="390" rx="0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/>
<path d="M170.0 480.0 L920.0 480.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="930.0,480.0 918.0,487.0 918.0,473.0" fill="#607a91"/>
<path d="M170.0 480.0 L170.0 80.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="170.0,70.0 177.0,82.0 163.0,82.0" fill="#607a91"/>
<text x="540" y="520" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">CI/CD成熟度（共通基盤・標準設定・運用手順・障害対応体制）</text>
<text x="174" y="502" text-anchor="start" font-family="sans-serif" font-size="14" fill="#55646d">低い</text>
<text x="910" y="502" text-anchor="end" font-family="sans-serif" font-size="14" fill="#55646d">高い</text>
<text x="146" y="285" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53" transform="rotate(-90 146 285)">テスト基盤を保守する共通チーム</text>
<text x="122" y="474" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#55646d" transform="rotate(-90 122 474)">なし</text>
<text x="122" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#55646d" transform="rotate(-90 122 102)">あり</text>
<rect x="186" y="270" width="360" height="194" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="366" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b5f9e">ノーコード型SaaS</text>
<text x="206" y="332" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">・実行基盤・運用負担の外部化</text><text x="206" y="354" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">・ブラックボックス型E2Eの汎用性</text><text x="206" y="376" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">・導入・運用の専門知識への依存低減</text><text x="206" y="398" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">・保守開発中心・技術スタックが多様な案件向き</text>
<rect x="554" y="106" width="340" height="194" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="2"/>
<text x="724" y="136" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#6a4ea6">Playwright＋AIエージェント</text>
<text x="574" y="168" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">・既存CI/CD基盤の再利用</text><text x="574" y="190" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">・テストコードの実装自由度の高さ</text><text x="574" y="212" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">・基盤保守コストの共通化</text><text x="574" y="234" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">・高度な制御が必要な案件向き</text>
<path d="M546.0 380.0 L681.1 312.5" stroke="#18324b" stroke-width="3" fill="none" stroke-dasharray="8 6"/><polygon points="690.0,308.0 682.4,319.6 676.1,307.1" fill="#18324b"/>
<text x="700" y="390" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#18324b">中長期</text><text x="700" y="409" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">共通CI/CD基盤と運用能力を</text><text x="700" y="428" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">整備し、OSSを活用できる</text><text x="700" y="447" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">案件を増やす</text>
<text x="206" y="230" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#18324b">短期</text><text x="206" y="249" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">SaaSで検証効率化の効果を先に得る</text>
<text x="500" y="550" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">SaaSとOSSの排他的な選択ではなく、それぞれを適切な条件で利用できる状態を目指す。</text><text x="500" y="572" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">個々の製品機能・契約条件・制約で判断は変わる</text>
</svg>
