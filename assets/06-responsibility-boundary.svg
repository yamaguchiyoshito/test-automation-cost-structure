<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="436" viewBox="0 0 1000 436" role="img" aria-label="提供者へ移せる責任と利用者に残る責任" aria-describedby="desc">
<desc id="desc">破線の境界の上に、サービス提供者へ移せるもの（クラウド上での実行、スケジュール実行、結果ログ、通知、テストの自動修復）、下に利用者に残るもの（テスト対象の仕様の理解、期待結果の定義、テストデータ・アカウントの準備、テストの十分性判断）を並べた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">責任の一部はサービス提供者へ移る。すべてではない</text>
<path d="M60 240 H940" stroke="#607a91" stroke-width="2" stroke-dasharray="10 8"/>
<text x="940" y="230" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="700" fill="#55646d">責任の境界</text>
<text x="60" y="118" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#2f6b45">サービス提供者へ移せるもの</text>
<rect x="60" y="150" width="154" height="34" rx="17.0" fill="#e0f0e9" stroke="#8ea6b2" stroke-width="1"/><text x="137" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">クラウド上での実行</text>
<rect x="228" y="150" width="140" height="34" rx="17.0" fill="#e0f0e9" stroke="#8ea6b2" stroke-width="1"/><text x="298" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">スケジュール実行</text>
<rect x="382" y="150" width="84" height="34" rx="17.0" fill="#e0f0e9" stroke="#8ea6b2" stroke-width="1"/><text x="424" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">結果ログ</text>
<rect x="480" y="150" width="56" height="34" rx="17.0" fill="#e0f0e9" stroke="#8ea6b2" stroke-width="1"/><text x="508" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">通知</text>
<rect x="550" y="150" width="140" height="34" rx="17.0" fill="#e0f0e9" stroke="#8ea6b2" stroke-width="1"/><text x="620" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テストの自動修復</text>
<text x="60" y="290" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#9c3f2a">利用者に残るもの</text>
<rect x="60" y="322" width="182" height="34" rx="17.0" fill="#f7e9d4" stroke="#8ea6b2" stroke-width="1"/><text x="151" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テスト対象の仕様の理解</text>
<rect x="256" y="322" width="126" height="34" rx="17.0" fill="#f7e9d4" stroke="#8ea6b2" stroke-width="1"/><text x="319" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">期待結果の定義</text>
<rect x="396" y="322" width="238" height="34" rx="17.0" fill="#f7e9d4" stroke="#8ea6b2" stroke-width="1"/><text x="515" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テストデータ・アカウントの準備</text>
<rect x="648" y="322" width="154" height="34" rx="17.0" fill="#f7e9d4" stroke="#8ea6b2" stroke-width="1"/><text x="725" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テストの十分性判断</text>
<text x="500" y="410" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">ノーコード型SaaSは上側の範囲が広い。サービス利用料とベンダーへの依存は別途評価する</text>
</svg>
