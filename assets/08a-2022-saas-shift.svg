<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="316" viewBox="0 0 1000 316" role="img" aria-label="左の「それ以前」（案件ごとに自動化環境を構築し投資効果を個別に検証）から、中央の「2022年の転換」（テスト自動化SaaSの利用と横展開）を経て、右の「安定したコスト効果」（実行基盤と運用の外部化、先行事例による見積り、技術スタックを問わない適用）へ至る3段の図">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">2022年の転換：テスト自動化SaaSの利用で安定したコスト効果を創出</text>
<rect x="60" y="100" width="260" height="130" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="190" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">それ以前</text><text x="190" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">案件ごとに自動化環境を構築し、</text><text x="190" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">投資効果を個別に検証していた</text>
<path d="M320.0 165.0 L360.0 165.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="370.0,165.0 358.0,172.0 358.0,158.0" fill="#607a91"/>
<rect x="370" y="100" width="260" height="130" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="500" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2b5f9e">2022年の転換</text><text x="500" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">テスト自動化SaaSを利用し、</text><text x="500" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">多様な既存案件へ横展開</text>
<path d="M630.0 165.0 L670.0 165.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="680.0,165.0 668.0,172.0 668.0,158.0" fill="#607a91"/>
<rect x="680" y="100" width="260" height="130" rx="12" fill="#e0f0e9" stroke="#5aa06f" stroke-width="2"/>
<text x="810" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2f6b45">安定したコスト効果</text><text x="810" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">実行基盤と運用をサービス側へ</text><text x="810" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">先行事例で効果を見積もれる</text><text x="810" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">技術スタックを問わず適用</text>
<text x="500" y="290" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">狙いは、限られた専門人材で、多様な既存案件に横展開できる検証効率化策を選ぶこと</text>
</svg>
