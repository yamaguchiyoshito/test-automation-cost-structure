<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="326" viewBox="0 0 1000 326" role="img" aria-label="SUTの構成" aria-describedby="desc">
<desc id="desc">利用者が操作するSUT（テスト対象のシステム）を1つの箱で示し、中に画面、API、業務ロジック、データを並べた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">SUT：テスト対象のシステム</text>
<rect x="60" y="130" width="170" height="70" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="145" y="161" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">利用者</text><text x="145" y="185" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">操作する</text>
<path d="M230.0 165.0 L320.0 165.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="330.0,165.0 318.0,172.0 318.0,158.0" fill="#607a91"/>
<text x="280" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">操作</text>
<rect x="330" y="90" width="610" height="150" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="635" y="120" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b5f9e">SUT（System Under Test）</text>
<text x="635" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">業務アプリケーションなど、テストの対象そのもの</text>
<rect x="360" y="170" width="126" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="423" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">画面</text>
<rect x="500" y="170" width="126" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="563" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">API</text>
<rect x="640" y="170" width="126" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="703" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">業務ロジック</text>
<rect x="780" y="170" width="126" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="843" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">データ</text>
<text x="500" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">SUTは機能追加や画面変更で変わり続ける。その変更はテスト自動化の側にも影響する</text>
</svg>
