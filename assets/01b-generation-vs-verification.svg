<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="生成AI以前と以後のリードタイム" aria-describedby="desc">
<desc id="desc">生成AI以前と以後の工程の帯を比べ、生成が短くなった後も検証の帯が残り、全体のリードタイムを左右することを示す図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">生成が速くなるほど、検証がリードタイムを決める</text>
<text x="170" y="148" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">生成AI以前</text><text x="170" y="170" text-anchor="end" font-family="sans-serif" font-size="16" fill="#55646d">生成に時間の比重</text>
<rect x="200" y="120" width="360" height="64" rx="8" fill="#e1edf8" stroke="#8ea6b2" stroke-width="1"/>
<text x="380" y="158" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">生成</text>
<rect x="560" y="120" width="230" height="64" rx="8" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="675" y="158" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">検証</text>
<rect x="790" y="120" width="150" height="64" rx="8" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="865" y="158" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">手戻り・環境維持</text>
<path d="M200.0 210.0 L930.0 210.0" stroke="#8ea6b2" stroke-width="2" fill="none"/><polygon points="940.0,210.0 928.0,217.0 928.0,203.0" fill="#8ea6b2"/>
<text x="570" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#55646d">リードタイム</text>
<text x="170" y="278" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">生成AI以後</text><text x="170" y="300" text-anchor="end" font-family="sans-serif" font-size="16" fill="#55646d">検証が全体を左右</text>
<rect x="200" y="250" width="110" height="64" rx="8" fill="#e1edf8" stroke="#8ea6b2" stroke-width="1"/>
<text x="255" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">生成</text>
<rect x="310" y="250" width="230" height="64" rx="8" fill="#f7e9d4" stroke="#c0604a" stroke-width="2"/>
<text x="425" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#9c3f2a">検証</text>
<rect x="540" y="250" width="150" height="64" rx="8" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="615" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">手戻り・環境維持</text>
<path d="M200.0 340.0 L680.0 340.0" stroke="#8ea6b2" stroke-width="2" fill="none"/><polygon points="690.0,340.0 678.0,347.0 678.0,333.0" fill="#8ea6b2"/>
<text x="445" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#55646d">リードタイム</text>
<path d="M700 325 H780 V290" stroke="#c0604a" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polygon points="780.0,290.0 787.0,302.0 773.0,302.0" fill="#c0604a"/>
<text x="790" y="318" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#9c3f2a">検証が</text><text x="790" y="338" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#9c3f2a">クリティカルパスに</text>
<text x="500" y="410" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#18324b">生成の高速化 ≠ 開発全体の生産性向上</text>
<text x="500" y="445" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">生成・検証・手戻り・環境維持まで含めて評価する。検証の短縮が、生成の高速化で得た余力を全体へ波及させる</text>
</svg>
