<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="保守開発の制約と適用しにくい施策" aria-describedby="desc">
<desc id="desc">左に保守開発の5つの制約（変更範囲の制限、既存アーキテクチャへの依存、プロセスやテスト基盤の変更制約、技術的負債、テスト容易性のための内部変更の難しさ）、右に適用しにくい施策（単体テストの自動化強化、依存関係の分離、テスト容易性を考慮したコード改善）を置き、矢印で結んだ図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">保守開発の制約が、内部構造に手を入れる施策を阻む</text>
<text x="60" y="100" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#55646d">保守開発の制約</text>
<rect x="60" y="116" width="440" height="36" rx="18.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="280" y="139" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">ソースコードや内部設計の変更範囲の制限</text>
<rect x="60" y="164" width="440" height="36" rx="18.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="280" y="187" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">既存のアーキテクチャやフレームワークへの依存</text>
<rect x="60" y="212" width="440" height="36" rx="18.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="280" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">開発プロセスやテスト基盤の変更に対する制約</text>
<rect x="60" y="260" width="440" height="36" rx="18.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="280" y="283" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">既存システムの技術的負債</text>
<rect x="60" y="308" width="440" height="36" rx="18.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="280" y="331" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テスト容易性を考慮した内部構造への変更の難しさ</text>
<path d="M500.0 230.0 L570.0 230.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="580.0,230.0 568.0,237.0 568.0,223.0" fill="#607a91"/>
<text x="580" y="100" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#55646d">適用しにくい施策</text>
<rect x="580" y="116" width="360" height="228" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="2"/>
<text x="760" y="158" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#9c3f2a">内部構造の改善を伴う施策</text><text x="760" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">単体テストの自動化強化</text><text x="760" y="236" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">依存関係の分離</text><text x="760" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">テスト容易性を考慮したコード改善</text>
<text x="500" y="404" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">内部構造を自由に変更できない案件では、こうした施策を適用しにくい。内部に手を入れずに済む検証手段が必要になる</text>
</svg>
