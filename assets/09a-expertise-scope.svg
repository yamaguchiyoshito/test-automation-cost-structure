<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="402" viewBox="0 0 1000 402" role="img" aria-label="スクリプト作成と、専門家が解決してきたこと" aria-describedby="desc">
<desc id="desc">左に小さくスクリプト作成（テストを一度動かす。AIエージェントで容易になった部分）、右に大きく専門家が長年解決してきたこと（テストの安定実行、テストデータの管理、実行失敗時の原因切り分け、SUTの変更への追従、ブラウザや依存ライブラリの更新、実行環境の管理、テスト結果と証跡の管理、継続的な運用体制の整備）を並べ、両者が等しくないことを示す図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">専門家が解決してきたのは、スクリプト作成ではなく安定運用</text>
<rect x="60" y="110" width="220" height="200" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="170" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">スクリプト作成</text><text x="170" y="198" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">テストを一度動かす</text><text x="170" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">AIエージェントで</text><text x="170" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">容易になった部分</text>
<text x="320" y="216" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#18324b">≠</text>
<rect x="360" y="90" width="580" height="240" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="650" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">専門家が長年解決してきたこと ＝ テストを安定して動かし続ける技術</text>
<rect x="384" y="140" width="256" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="512" y="162" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テストの安定実行</text>
<rect x="654" y="140" width="256" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="782" y="162" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テストデータの管理</text>
<rect x="384" y="184" width="256" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="512" y="206" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">実行失敗時の原因切り分け</text>
<rect x="654" y="184" width="256" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="782" y="206" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">SUTの変更への追従</text>
<rect x="384" y="228" width="256" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="512" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">ブラウザや依存ライブラリの更新</text>
<rect x="654" y="228" width="256" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="782" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">実行環境の管理</text>
<rect x="384" y="272" width="256" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="512" y="294" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">テスト結果と証跡の管理</text>
<rect x="654" y="272" width="256" height="34" rx="17.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="782" y="294" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">継続的な運用体制の整備</text>
<text x="500" y="376" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">生成したテストコードが初回に動作しても、それだけでは継続運用できるTASを構築したとはいえない</text>
</svg>
