<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="288" viewBox="0 0 1000 288" role="img" aria-label="要求から、生成AIと開発者による生成を経て、コードやテストなどの成果物ができる3段の流れ。生成の工程が生成AIで高速化したことを示す図">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">生成：要求から成果物をつくる作業</text>
<rect x="60" y="110" width="240" height="90" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="180" y="151" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">要求</text><text x="180" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">何をつくるか</text>
<path d="M300.0 155.0 L370.0 155.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="380.0,155.0 368.0,162.0 368.0,148.0" fill="#607a91"/>
<rect x="380" y="100" width="240" height="110" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="2"/>
<text x="500" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#6a4ea6">生成</text><text x="500" y="162" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">生成AI・開発者がつくる</text><text x="500" y="184" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">短時間で大量に</text>
<path d="M620.0 155.0 L690.0 155.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="700.0,155.0 688.0,162.0 688.0,148.0" fill="#607a91"/>
<rect x="700" y="110" width="240" height="90" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="820" y="151" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">成果物</text><text x="820" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">コードやテストなど</text>
<text x="500" y="262" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">生成AIの登場で、この工程が高速化した</text>
</svg>
