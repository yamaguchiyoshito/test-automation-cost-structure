<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="398" viewBox="0 0 1000 398" role="img" aria-label="画面E2Eテストと4種類のSUT" aria-describedby="desc">
<desc id="desc">上の画面E2Eテストから、JSP、SPA、JavaScriptを多用するWebアプリ、レガシーWebアプリという4つのSUTへ同じ矢印が伸び、実装技術に依存しにくいことを示す図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">画面E2Eテストは、SUTの実装技術に依存しにくい</text>
<rect x="300" y="90" width="400" height="70" rx="12" fill="#e1edf8" stroke="#8ea6b2" stroke-width="1"/><text x="500" y="121" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">画面E2Eテスト</text><text x="500" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">利用者から見える画面操作とその結果を検証</text>
<rect x="70" y="250" width="190" height="76" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="165" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">JSP</text><text x="165" y="308" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">サーバーサイド描画</text>
<path d="M500.0 160.0 L174.7 247.4" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="165.0,250.0 174.8,240.1 178.4,253.6" fill="#607a91"/>
<rect x="290" y="250" width="190" height="76" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="385" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">SPA</text><text x="385" y="308" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">クライアント側描画</text>
<path d="M500.0 160.0 L392.9 243.8" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="385.0,250.0 390.1,237.1 398.8,248.1" fill="#607a91"/>
<rect x="510" y="250" width="190" height="76" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="605" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">JS多用のWebアプリ</text><text x="605" y="308" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">動的な画面更新</text>
<path d="M500.0 160.0 L597.4 243.5" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="605.0,250.0 591.3,247.5 600.4,236.9" fill="#607a91"/>
<rect x="730" y="250" width="190" height="76" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="825" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">レガシーWebアプリ</text><text x="825" y="308" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">既存の技術構成</text>
<path d="M500.0 160.0 L815.4 247.3" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="825.0,250.0 811.6,253.5 815.3,240.1" fill="#607a91"/>
<text x="500" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">同じ検証のしかた</text>
<text x="500" y="372" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">画面の実装技術が異なれば、要素特定や非同期処理への対応などの個別調整は必要になる</text>
</svg>
