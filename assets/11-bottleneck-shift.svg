<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-label="検証のボトルネックの移動" aria-describedby="desc">
<desc id="desc">左の従来のボトルネックである単純な実行作業から、右の二層の課題、第一層の自動化を維持する能力と、第二層の正しさを判断する根拠へ移ったことを示す図。第二層には要件・設計・リスク、テスト観点、期待結果、証跡をつなぐ追跡の鎖と、SUTの現状だけを根拠にすると不具合を固定するという注意を含む</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">検証のボトルネックは、実行作業から二つの課題へ移った</text>
<rect x="60" y="150" width="220" height="180" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="170" y="200" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#55646d">従来のボトルネック</text><text x="170" y="244" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">単純な実行作業</text><text x="170" y="266" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">テストの作成・実行・</text><text x="170" y="288" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">保守にかかる作業</text>
<path d="M280.0 240.0 L350.0 240.0" stroke="#607a91" stroke-width="4" fill="none"/><polygon points="360.0,240.0 348.0,247.0 348.0,233.0" fill="#607a91"/>
<text x="320" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">生成コスト低下後</text>
<rect x="360" y="100" width="580" height="110" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="380" y="130" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">第一層　自動化を維持する能力</text>
<text x="380" y="158" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">TASを安定して運用するための基盤と組織能力。</text><text x="380" y="178" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">テストが自動で作成・実行されても、継続運用コストはなくならない</text>
<rect x="360" y="230" width="580" height="248" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="2"/>
<text x="380" y="260" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">第二層　正しさを判断する根拠</text>
<rect x="380" y="282" width="150" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="455" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">要件・設計・リスク</text>
<path d="M530.0 300.0 L544.0 300.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="554.0,300.0 542.0,307.0 542.0,293.0" fill="#607a91"/>
<rect x="554" y="282" width="110" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="609" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">テスト観点</text>
<path d="M664.0 300.0 L678.0 300.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="688.0,300.0 676.0,307.0 676.0,293.0" fill="#607a91"/>
<rect x="688" y="282" width="100" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="738" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">期待結果</text>
<path d="M788.0 300.0 L802.0 300.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="812.0,300.0 800.0,307.0 800.0,293.0" fill="#607a91"/>
<rect x="812" y="282" width="80" height="36" rx="18.0" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/><text x="852" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">証跡</text>
<text x="380" y="344" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">要件・設計・リスクとテスト観点・期待結果を結び付け、</text><text x="380" y="363" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">検証の根拠を追跡できるようにする</text>
<rect x="380" y="384" width="540" height="76" rx="12" fill="#fcfdfd" stroke="#c0604a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="650" y="414" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9c3f2a">注意：SUTの現在の振る舞いだけを根拠に期待結果を作ると、</text><text x="650" y="434" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9c3f2a">既存の不具合を正しい動作として固定してしまう</text>
<text x="500" y="520" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">テストの十分性や期待結果の正しさは、自動的に作成・実行されても自動的には保証されない</text>
</svg>
